{{ define "main" }}

<article class="h-entry reader" id="reader">
  <header class="header">
    <div class="meta">
      <time class="dt-published" datetime='{{ .Date | time.Format "2006-01-02T15:04:05Z07:00" }}'>{{ .Date | time.Format
        "2 January 2006" }}</time>
      <span class="dot"></span>
      {{ range .Params.tags }}<span class="tag p-category">{{ . }}</span>{{ end }}
      <span class="dot"></span>
      <span>{{ .ReadingTime }} min read</span>
    </div>
    <h1 class="p-name post-title">{{ .Title }}</h1>
    <p class="p-summary lede">{{ .Params.summary }}</p>
  </header>

  <aside class="post-heart" data-post-heart data-slug="{{ .Slug }}">
    <div class="heart-container" title="react to this post">
      <input type="checkbox" class="checkbox" data-heart-checkbox />
      <div class="heart_sprite" aria-hidden="true"></div>
      <svg class="svg-celebrate" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <polygon points="10,10 16,10 16,16"></polygon>
        <polygon points="90,10 84,10 84,16"></polygon>
        <polygon points="10,90 16,90 16,84"></polygon>
        <polygon points="90,90 84,90 84,84"></polygon>
        <polygon points="50,4 54,10 46,10"></polygon>
        <polygon points="50,96 54,90 46,90"></polygon>
      </svg>
    </div>
    <span class="post-heart-count" data-heart-count>—</span>
  </aside>

  <div class="e-content prose-body">
    {{ .Content }}
  </div>

  <footer class="entry-footer">
    <a class="u-url" href="{{ .Permalink }}">{{ .Permalink }}</a>
    <span class="dot"></span>
    <a class="p-author h-card" href="https://cheztervargas.com/">Chezter Vargas</a>
  </footer>
</article>

{{ end }}

{{ define "scripts" }}
<script type="module" src="/blog-list.js"></script>
<script type="module" src="/reaction.js"></script>
{{ end }}
