<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>
  (function () {
    var stored = localStorage.getItem('cv.theme');
    var theme = stored || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<title>{{ .Title }}</title>
{{ with .Params.description }}
<meta name="description" content="{{ . }}" />{{ end }}
<link rel="stylesheet" href="/styles.css" />
<link rel="stylesheet" href="/tablet.css" media="(max-width: 1024px)" />
<link rel="stylesheet" href="/mobile.css" media="(max-width: 640px), (max-width: 1024px) and (orientation: portrait)" />
<link rel="icon" href="/assets/favicon.ico" type="image/x-icon" />
{{ if .IsHome }}
<link rel="alternate" type="application/rss+xml" title="Chezter's Readings" href="/feed.xml" />{{ end }}
<script defer src="https://analytics.cheztervargas.com/site_visits.js"
  data-website-id="0ada5184-e307-4125-b5d6-e6b37861ce7c" data-performance="true"></script>
