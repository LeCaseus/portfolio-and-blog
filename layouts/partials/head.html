<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noai, noimageai">
<script>
  (function () {
    var stored = localStorage.getItem('cv.theme');
    var theme = stored || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<title>{{ .Title }}</title>
{{ with .Params.description }}
<meta name="description" content="{{ . }}" />
{{ end }}
<link rel="stylesheet" href="/styles.css" />
<link rel="stylesheet" href="/mobile.css" media="(max-width: 53.25em), (max-height: 600px)" />
<link rel="icon" href="/assets/favicons/16x16.ico" sizes="16x16" type="image/x-icon" />
<link rel="icon" href="/assets/favicons/32x32.ico" sizes="32x32" type="image/x-icon" />
<link rel="icon" href="/assets/favicons/48x48.ico" sizes="48x48" type="image/x-icon" />
<link rel="apple-touch-icon" href="/assets/favicons/180x180.ico" />
<link rel="icon" href="/assets/favicons/512x512.ico" sizes="512x512" type="image/x-icon" />
<link rel="webmention" href="https://cheztervargas.com/api/webmention" />
{{ with site.Home.OutputFormats.Get "rss" }}
<link rel="{{ .Rel }}" type="{{ .MediaType.Type }}" href="{{ .Permalink }}" title="{{ site.Title }}" />{{ end }}
{{ if not .IsHome }}{{ range .AlternativeOutputFormats }}
<link rel="{{ .Rel }}" type="{{ .MediaType.Type }}" href="{{ .Permalink }}" title="{{ $.Title }}" />{{ end }}{{ end }}
{{ with .Site.GetPage "/photos" }}{{ with .OutputFormats.Get "atom" }}
<link rel="alternate" type="application/atom+xml" title="Chezter's Photos" href="{{ .Permalink }}" />{{ end }}{{ end }}
<script>
  (function () {
    var loaded = false;
    var interactions = ['pointerdown', 'pointermove', 'wheel', 'keydown', 'touchstart', 'scroll'];
    function load_umami() {
      if (loaded) return;
      loaded = true;
      interactions.forEach(function (name) {removeEventListener(name, load_umami, {capture: true});});
      var script = document.createElement('script');
      script.src = '/site_visits.js';
      script.defer = true;
      script.dataset.websiteId = '0ada5184-e307-4125-b5d6-e6b37861ce7c';
      document.head.appendChild(script);
    }
    interactions.forEach(function (name) {
      addEventListener(name, load_umami, {passive: true, capture: true});
    });
  })();
</script>
