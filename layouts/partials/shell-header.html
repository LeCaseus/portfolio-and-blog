<header class="status" role="banner">
  <div class="left">
    <span class="dot" aria-hidden="true"></span>ELECTRODES CONNECTED · <span class="build-tag">v3.5 · stable</span>
  </div>
  <div class="center">{{ .Params.statusline }}</div>
  <div class="right">
    <span>UTC <span data-clock>00:00:00</span></span>
    <label class="switch" aria-label="Toggle theme">
      <input type="checkbox" class="toggle" data-theme-toggle />
      <span class="slider"></span>
    </label>
  </div>
</header>
