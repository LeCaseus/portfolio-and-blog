baseURL = 'https://cheztervargas.com/'
locale = "en"
title = "Chezter's Records"
uglyURLs = false
disableKinds = ["taxonomy", "term"]

[params]
  author = 'Chezter Vargas'
  contactEmail = 'records [at] cheztervargas [dot] com'

[params.note_kinds.like]
  label = "liked"
  class = "u-like-of"
  emoji = "❤️"

[params.note_kinds.bookmark]
  label = "bookmarked"
  class = "u-bookmark-of"
  emoji = "🔖"

[params.note_kinds.reply]
  label = "replying to"
  class = "u-in-reply-to"
  emoji = "↩️"

[params.note_kinds.quote]
  label = "quoting"
  class = "u-repost-of"
  emoji = "💬"
  
[permalinks]
  posts = "/blog/:slug/"
  notes = "/notes/:slug"
  
[outputFormats.RSS]
  baseName = "feed"
  mediaType = "application/rss+xml"
  isPlainText = true

[outputFormats.NotesRSS]
  baseName = "notes"
  mediaType = "application/rss+xml"
  isPlainText = true

[outputFormats.BlogRSS]
  baseName = "blog"
  mediaType = "application/rss+xml"
  isPlainText = true

[mediaTypes."application/atom+xml"]
  suffixes = ["xml"]

[outputFormats.AtomFeed]
  baseName = "atom"
  mediaType = "application/atom+xml"
  isPlainText = true

[outputs]
  home = ["HTML", "RSS", "NotesRSS", "BlogRSS", "AtomFeed"]
  
[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false
